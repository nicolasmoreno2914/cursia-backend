# ══════════════════════════════════════════════════════════════════════════════
# deploy-staging.yml — CI/CD: push a staging → deploy automático a la instancia
# de staging, en el MISMO VPS que producción pero en directorio/puerto/procesos
# pm2 completamente separados. Nunca toca los procesos ni el directorio de
# producción (cursia-backend en VPS_PATH) — ver deploy.yml para ese workflow.
# ══════════════════════════════════════════════════════════════════════════════
#
# REQUISITOS ADICIONALES (GitHub → Settings → Secrets and variables → Actions),
# sobre los que ya existen para producción (VPS_HOST, VPS_USER, VPS_SSH_KEY):
#
#   VPS_PATH_STAGING     Directorio staging en el VPS, ej. /var/www/cursia-backend-staging
#   HEALTH_URL_STAGING   URL de health check de staging, ej. https://api-staging.cursia.nomaddi.com/health
#
# El puerto y las credenciales de Supabase de staging viven en el .env propio
# de VPS_PATH_STAGING en el VPS (nunca se sincronizan por rsync — ver el paso
# de sync abajo, que excluye .env igual que el workflow de producción). Ese
# .env se crea UNA sola vez a mano en el VPS; los deploys siguientes lo dejan
# intacto.
#
# ══════════════════════════════════════════════════════════════════════════════

name: Deploy to Staging (Contabo VPS)

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install all dependencies (including devDeps for tsc)
        run: npm ci

      - name: Compile TypeScript on runner
        run: npm run build

      - name: Verify dist/main.js
        run: |
          if [ ! -f dist/main.js ]; then
            echo "❌ dist/main.js no encontrado."
            exit 1
          fi
          echo "✅ dist/main.js OK — $(du -sh dist/ | cut -f1)"

      - name: Check Generation Manifest determinism
        run: node scripts/check-generation-manifest-determinism.js

      - name: Check Packaging Plan determinism (Fase 5B.1)
        run: node scripts/check-packaging-plan-determinism.js

      - name: Check Packaging exam/video mapping by UUID (Fase 5B.1)
        run: node scripts/check-packaging-exam-video-mapping.js

      - name: Check dynamic video delivery (Fase 5B.2.A)
        run: node scripts/check-dynamic-video-delivery.js

      - name: Check dynamic-package-worker hardening (review-it2 fix wave)
        run: node scripts/check-dynamic-package-worker-hardening.js

      - name: Check dynamic feature gating (Fase 9 — G1/G3/G4 + video real I1)
        run: node scripts/check-dynamic-feature-gating.js

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Fix VPS staging file ownership (heals stale root-owned files)
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              "sudo mkdir -p ${{ secrets.VPS_PATH_STAGING }} && sudo chown -R ${{ secrets.VPS_USER }}:${{ secrets.VPS_USER }} ${{ secrets.VPS_PATH_STAGING }}"

      - name: Sync source + dist to VPS (staging path only — nunca toca VPS_PATH de producción)
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude '.env.*' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH_STAGING }}/"

      - name: Install prod deps + migrate + restart staging processes on VPS
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              'set -e
               cd '"${{ secrets.VPS_PATH_STAGING }}"'

               if [ ! -f .env ]; then
                 echo "❌ Falta .env en '"${{ secrets.VPS_PATH_STAGING }}"' — créalo a mano una sola vez"
                 echo "   (PORT distinto al de producción + credenciales del proyecto de Supabase de staging)."
                 exit 1
               fi

               if grep -q "^NODE_ENV=production" .env; then
                 echo "✓ NODE_ENV=production en el .env de staging"
               else
                 echo "✗ El .env de staging NO tiene NODE_ENV=production — TypeORM synchronize quedaría activo y borraría columnas (I5, Fase 5A)."
                 exit 1
               fi

               # Fase 9 (flag-gating): V2 va detrás de flags de entorno que viven en
               # el .env del VPS (no se sincroniza). Idempotente: solo AGREGA lo que
               # falta; nunca imprime valores del .env, solo nombres de clave.
               #
               # NOTA de comillas: todo este bloque remoto viaja como UN string entre
               # comillas SIMPLES dentro del paso de GitHub Actions (para poder pegar
               # el secret VPS_PATH_STAGING a mitad de camino) — un caracter comilla
               # simple literal en cualquier punto de acá ABAJO cortaría ese string a
               # la mitad. Por eso, en vez de $(quote) o patrones tipo *"*, *#* con
               # comillas simples, se arman los caracteres delicados (CR, comilla
               # simple, comilla doble) con printf + código octal.
               _Q_CR=$(printf "\015")
               _Q_SQ=$(printf "\047")
               _Q_DQ=$(printf "\042")
               _Q_TAB=$(printf "\011")
               # M3/M5 (review, fix wave): el valor de una línea KEY=... puede venir
               # entrecomillado (KEY="true"), con un comentario al final (KEY=true #
               # nota) o con CRLF (checkout/edición en Windows) — "pelamos" eso antes
               # de comparar, para no dar un falso "apagado manual" ni un falso
               # "ya incluye el owner" que en realidad dotenv nunca vería.
               _flags_strip_value() {
                 # arg 1: el valor crudo tras "KEY="; stdout: pelado de CRLF, comentario
                 # final fuera de comillas y comillas simples/dobles que envuelven TODO.
                 local v
                 v="$1"
                 v="${v%"$_Q_CR"}"
                 case "$v" in
                   "$_Q_DQ"*"$_Q_DQ"|"$_Q_SQ"*"$_Q_SQ") ;; # entrecomillado completo: no recortar un # de adentro
                   *) v="${v%%#*}" ;;
                 esac
                 # rtrim de espacios que pudieran quedar antes de un comentario recortado
                 while [ "${v: -1}" = " " ] || [ "${v: -1}" = "$_Q_TAB" ]; do v="${v%?}"; done
                 case "$v" in
                   "$_Q_DQ"*"$_Q_DQ") v="${v#"$_Q_DQ"}"; v="${v%"$_Q_DQ"}" ;;
                   "$_Q_SQ"*"$_Q_SQ") v="${v#"$_Q_SQ"}"; v="${v%"$_Q_SQ"}" ;;
                 esac
                 printf "%s" "$v"
               }
               ensure_env_flag_true() {
                 local key="$1"
                 if grep -q "^${key}=" .env; then
                   local raw val
                   raw=$(grep "^${key}=" .env | tail -n 1)
                   val=$(_flags_strip_value "${raw#${key}=}")
                   if [ "$val" = "true" ]; then
                     echo "✓ ${key} presente en el .env de staging"
                   else
                     echo "⚠️  ${key} está en el .env de staging con un valor distinto de true — se respeta (apagado manual); V2 queda OFF"
                   fi
                 else
                   printf "\n%s=true\n" "$key" >> .env
                   echo "+ ${key} agregado al .env de staging"
                 fi
               }
               ensure_env_list_contains() {
                 local key="$1"
                 local item="$2"
                 local count
                 count=$(grep -c "^${key}=" .env || true)
                 if [ "$count" -eq 0 ]; then
                   printf "\n%s=%s\n" "$key" "$item" >> .env
                   echo "+ ${key} agregado al .env de staging"
                   return 0
                 fi
                 if [ "$count" -gt 1 ]; then
                   echo "⚠️  ${key} aparece más de una vez en el .env de staging — no se toca automáticamente (dotenv usaría la última línea; revisar a mano)"
                   return 0
                 fi
                 local raw val
                 raw=$(grep "^${key}=" .env)
                 val="${raw#${key}=}"
                 case "$val" in
                   *"$_Q_CR")
                     echo "⚠️  ${key} termina en CRLF — no se toca automáticamente (normalizar el archivo a LF a mano)"
                     return 0
                     ;;
                 esac
                 case "$val" in
                   *"$_Q_DQ"*|*"$_Q_SQ"*|*"#"*)
                     echo "⚠️  ${key} tiene comillas o un comentario en su valor — no se toca automáticamente (agregar el owner a mano si falta)"
                     return 0
                     ;;
                 esac
                 if printf "%s" "$val" | tr "," "\n" | grep -qix "$item"; then
                   echo "✓ ${key} ya incluye el owner de prueba de staging"
                   return 0
                 fi
                 # M4 (review, fix wave): reescritura atómica. awk arma el archivo
                 # completo en un tmp EN EL MISMO directorio (mismo filesystem → el
                 # mv final es un rename atómico, nunca deja .env truncado a mitad de
                 # escritura); se valida (no vacío, mismas líneas que el original)
                 # ANTES de reemplazar, y se conserva un .env.bak (rsync ya excluye
                 # .env.* — no se sincroniza nunca a otro lado).
                 local tmp new_line before_lines after_lines
                 tmp=".env.flags.tmp.$$"
                 new_line="${raw},${item}"
                 awk -v old="$raw" -v new="$new_line" "!d && \$0 == old { \$0 = new; d = 1 } { print }" .env > "$tmp"
                 if [ ! -s "$tmp" ]; then
                   echo "❌ ${key}: la reescritura del .env salió vacía — se aborta sin tocar .env"
                   rm -f "$tmp"
                   return 1
                 fi
                 # awk (no wc -l): wc -l cuenta SALTOS de línea, no líneas — un .env
                 # sin newline final (EOF sin \n, caso real en algunos VPS) daría un
                 # falso "cambió de líneas" y abortaría un edit válido. awk cuenta
                 # registros (NR), coherente con cómo el propio awk de arriba escribió
                 # "$tmp" (siempre termina cada línea con \n al hacer print).
                 before_lines=$(awk "END{print NR}" .env)
                 after_lines=$(awk "END{print NR}" "$tmp")
                 if [ "$before_lines" != "$after_lines" ]; then
                   echo "❌ ${key}: la reescritura del .env cambió de $before_lines a $after_lines líneas — se aborta sin tocar .env"
                   rm -f "$tmp"
                   return 1
                 fi
                 cp .env .env.bak
                 mv "$tmp" .env
                 echo "+ owner de prueba de staging agregado a ${key} (backup: .env.bak)"
               }

               ensure_pm2_process() {
                 local name="$1"
                 local start_script="$2"
                 if sudo pm2 describe "$name" > /dev/null 2>&1; then
                   sudo pm2 restart "$name" --update-env
                 else
                   sudo pm2 start npm --name "$name" -- run "$start_script"
                 fi
               }

               echo "━━━ [0/6] Verificar poppler-utils (pdftoppm — portadas de Gamma) ━━━"
               command -v pdftoppm > /dev/null 2>&1 || sudo apt-get install -y poppler-utils

               echo "━━━ [0b] Flags V2 de staging (DYNAMIC_COURSE_STRUCTURE, DYNAMIC_REAL_VIDEO_OWNERS) ━━━"
               ensure_env_flag_true DYNAMIC_COURSE_STRUCTURE
               # Owner de prueba de staging (un id, no un secreto) habilitado para video real (Videogen).
               ensure_env_list_contains DYNAMIC_REAL_VIDEO_OWNERS aa2fa9a1-afb1-4b01-8646-94a0cb272b57

               echo "━━━ [1/6] Instalar dependencias de producción ━━━"
               npm install --omit=dev

               echo "━━━ [2/6] Alinear restricciones de production_jobs (staging) ━━━"
               node scripts/migrate-production-jobs-constraints.js

               echo "━━━ [3/6] Aplicar modelo de estructura dinámica de cursos (staging) ━━━"
               MIGRATION_ENV=staging node scripts/migrate-dynamic-course-structure.js

               echo "━━━ [4/6] Verificar esquema de estructura dinámica de cursos (staging) ━━━"
               MIGRATION_ENV=staging node scripts/verify-dynamic-course-structure-schema.js

               echo "━━━ [4b] Blueprints: migración (staging) ━━━"
               MIGRATION_ENV=staging node scripts/migrate-course-blueprints.js

               echo "━━━ [4c] Blueprints: verificación de esquema (staging) ━━━"
               MIGRATION_ENV=staging node scripts/verify-course-blueprints-schema.js

               echo "━━━ [4d] Blueprints: auditoría de datos (solo lectura, staging) ━━━"
               MIGRATION_ENV=staging node scripts/audit-course-blueprints.js

               echo "━━━ [4e] Generation Manifests: migración (staging) ━━━"
               MIGRATION_ENV=staging node scripts/migrate-generation-manifests.js

               echo "━━━ [4f] Generation Manifests: verificación de esquema (staging) ━━━"
               MIGRATION_ENV=staging node scripts/verify-generation-manifests-schema.js

               echo "━━━ [4g] Generation Manifests: auditoría (solo lectura, staging) ━━━"
               MIGRATION_ENV=staging node scripts/audit-generation-manifests.js

               echo "━━━ [4h] Dynamic Generation: migración (staging) ━━━"
               MIGRATION_ENV=staging node scripts/migrate-dynamic-generation.js

               echo "━━━ [4i] Dynamic Generation: verificación de esquema (staging) ━━━"
               MIGRATION_ENV=staging node scripts/verify-dynamic-generation-schema.js

               echo "━━━ [4j] Dynamic Generation: auditoría (solo lectura, staging) ━━━"
               MIGRATION_ENV=staging node scripts/audit-dynamic-generation.js

               echo "━━━ [4k] Storage: políticas RLS mínimas de cursia-artifacts (staging) ━━━"
               MIGRATION_ENV=staging node scripts/migrate-storage-artifacts-policies.js

               echo "━━━ [5/6] Migrar usage_events y cost_rates (staging) ━━━"
               node scripts/migrate-usage-events-costs.js

               echo "━━━ [6/6] Recargar PM2 staging (zero-downtime) ━━━"
               ensure_pm2_process cursia-backend-staging start:prod
               ensure_pm2_process cursia-content-worker-staging start:content-worker
               ensure_pm2_process cursia-video-worker-staging start:video-worker
               ensure_pm2_process cursia-audio-worker-staging start:audio-worker
               ensure_pm2_process cursia-h5p-worker-staging start:h5p-worker
               ensure_pm2_process cursia-gamma-worker-staging start:gamma-worker
               ensure_pm2_process cursia-package-worker-staging start:package-worker
               ensure_pm2_process cursia-full-worker-staging start:full-worker
               ensure_pm2_process cursia-dynamic-item-worker-staging start:dynamic-item-worker
               ensure_pm2_process cursia-dynamic-package-worker-staging start:dynamic-package-worker
               sudo pm2 save
               sudo pm2 status

               echo "━━━ [6b] Fase 5A: preflight (solo lectura, staging) ━━━"
               MIGRATION_ENV=staging node scripts/preflight-dynamic-generation.js

               echo "━━━ [6c] Estabilidad PM2 staging (ventana de 45 s) ━━━"
               PM2_BEFORE=$(sudo pm2 jlist | node scripts/pm2-staging-stability.js snapshot)
               sleep 45
               sudo pm2 jlist | node scripts/pm2-staging-stability.js compare "$PM2_BEFORE"

               echo "✅ Deploy a staging completado."'

      - name: Health check post-deploy
        run: |
          echo "Esperando 20 segundos para que NestJS inicialice…"
          sleep 20
          for i in 1 2 3 4 5; do
            RESPONSE=$(curl -sf --max-time 15 "${{ secrets.HEALTH_URL_STAGING }}" || echo "FAILED")
            if echo "$RESPONSE" | grep -q '"status":"ok"'; then
              echo "✅ Health check OK (intento $i): $RESPONSE"
              exit 0
            fi
            echo "⏳ Intento $i: staging no disponible aún ($RESPONSE), esperando 8s…"
            sleep 8
          done
          echo "❌ Health check FALLÓ tras 5 intentos"
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "⚠️  El deploy de STAGING falló. Último commit: $(git rev-parse --short HEAD)"
          echo "Esto NO afecta producción — cursia-backend sigue corriendo con su propio código."
