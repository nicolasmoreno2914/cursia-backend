# ══════════════════════════════════════════════════════════════════════════════
# staging-calibration.yml — plano de control de la calibración V2.1 (SOLO staging).
#
# Nunca despliega: sin rsync, sin npm install, sin migraciones, sin reiniciar los
# 11 procesos. Corre scripts/staging-v21-calibration.js del código YA desplegado
# en VPS_PATH_STAGING:
#   policy / authorize / report / preflight → solo DB (report y preflight: lectura)
#   worker_on / worker_off → DYNAMIC_PROVIDER_WORKER_ENABLED en el .env de staging +
#     reinicio SOLO de los 2 procesos que lo leen (API: abre runs v3; worker de
#     proveedores: reclama Gamma/TTS). Un deploy (push) lo vuelve a false siempre.
# Comparte el grupo de concurrencia con deploy-staging: nunca corren a la vez.
# ══════════════════════════════════════════════════════════════════════════════

name: Staging calibration control (V2.1)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción de calibración (staging)'
        type: choice
        options: ['report', 'preflight', 'policy', 'authorize', 'worker_on', 'worker_off']
        default: 'report'
      course_id:
        description: 'Id numérico del curso de calibración (authorize / report)'
        type: string
        default: ''

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  control:
    name: Calibration control (staging, sin deploy)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Validate inputs
        env:
          CAL_ACTION: ${{ inputs.action }}
          CAL_COURSE: ${{ inputs.course_id }}
        run: |
          case "$CAL_ACTION" in report|preflight|policy|authorize|worker_on|worker_off) ;; *) echo "❌ action inválida"; exit 1 ;; esac
          case "$CAL_COURSE" in "") ;; *[!0-9]*) echo "❌ course_id debe ser numérico"; exit 1 ;; esac
          if { [ "$CAL_ACTION" = authorize ] || [ "$CAL_ACTION" = report ]; } && [ -z "$CAL_COURSE" ]; then
            echo "❌ action=$CAL_ACTION necesita course_id"; exit 1
          fi
          echo "Calibración V2.1 (staging): acción=$CAL_ACTION curso=${CAL_COURSE:-(ninguno)}"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Run calibration action on the staging VPS (sin deploy)
        env:
          CAL_ACTION: ${{ inputs.action }}
          CAL_COURSE: ${{ inputs.course_id }}
        run: |
          printf "%s\n%s\n" "$CAL_ACTION" "$CAL_COURSE" | ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              'set -e
               cd '"${{ secrets.VPS_PATH_STAGING }}"'
               IFS= read -r _ACTION || true
               IFS= read -r _COURSE || true
               case "$_ACTION" in report|preflight|policy|authorize|worker_on|worker_off) ;; *) echo "❌ acción inválida"; exit 1 ;; esac
               case "$_COURSE" in "") ;; *[!0-9]*) echo "❌ curso inválido"; exit 1 ;; esac
               if [ ! -f .env ] || [ ! -f scripts/staging-v21-calibration.js ]; then
                 echo "❌ staging sin .env o sin el script (desplegá primero)"; exit 1
               fi
               case "$_ACTION" in
                 policy) MIGRATION_ENV=staging node scripts/staging-v21-calibration.js policy ;;
                 authorize) MIGRATION_ENV=staging node scripts/staging-v21-calibration.js authorize "$_COURSE" ;;
                 report) MIGRATION_ENV=staging node scripts/staging-v21-calibration.js report "$_COURSE" ;;
                 preflight) MIGRATION_ENV=staging node scripts/preflight-v21-providers.js ;;
                 worker_on|worker_off)
                   _MODE=on; [ "$_ACTION" = worker_off ] && _MODE=off
                   MIGRATION_ENV=staging node scripts/staging-v21-calibration.js worker "$_MODE"
                   sudo pm2 restart cursia-dynamic-provider-worker-staging --update-env
                   sudo pm2 restart cursia-backend-staging --update-env
                   sleep 8
                   sudo pm2 jlist | node -e "let s=\"\";process.stdin.on(\"data\",d=>s+=d).on(\"end\",()=>{const l=JSON.parse(s).filter(p=>/-staging$/.test(p.name));for(const p of l)console.log(p.name.padEnd(44)+p.pm2_env.status+\" restarts=\"+p.pm2_env.restart_time);if(l.some(p=>p.pm2_env.status!==\"online\"))process.exit(1)})"
                   MIGRATION_ENV=staging node scripts/preflight-v21-providers.js
                   ;;
               esac
               echo "✅ Acción de calibración terminada (sin deploy)."'
